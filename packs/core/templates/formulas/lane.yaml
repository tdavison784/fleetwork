# The `lane` formula: `ledger add --formula lane --var lane=<name> --var title=<title> --var profile=<profile>`
# expands into three linked items. `${name}` is filled from --var; `@key` refers to another item of this
# expansion and becomes its id. Items inherit `guard:` from the formula call (`--var guard=…` is not used;
# pass guard lists in an apply batch instead).
formula: lane
vars: [lane, title, profile]
items:
  - key: work
    kind: lane
    title: "Lane ${lane}: ${title}"
    brief: briefs/${lane}.md
    run: {profile: "${profile}", providers: [], auto-start: false}
  - key: review
    kind: review
    title: "Review and integrate lane ${lane}"
    needs: ["@work"]
  - key: cleanup
    kind: task
    title: "Clean up lane ${lane}: stop agent, remove workspace, safe-delete branch"
    needs: ["@review"]
